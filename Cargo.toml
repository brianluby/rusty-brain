[workspace]
resolver = "2"
members = [
    "crates/rb-types",
    "crates/rb-config",
    "crates/rb-store",
    "crates/rb-proto",
    "crates/rb-embed",
    "crates/rb-search",
    "crates/rb-engine",
    "crates/rb-enrich",
    "crates/rb-daemon",
    "crates/rb-mcp",
    "crates/rusty-brain",
    "crates/rb-agents",
    "crates/rb-hooks",
    "crates/rb-install",
    "crates/rb-eval",
    "crates/rb-redact",
    "crates/rb-tokens",
    "crates/rb-contract-guard",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["Brian Luby"]
repository = "https://github.com/brianluby/rusty-brain"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
include_dir = "0.7"
sha2 = "0.10"
tempfile = "3"
# --- P1 additions ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "io-std", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
# Opt-in loopback HTTP listener (HTTP PRD 2026-07-02). Minimal feature set:
# http1 + server only — no TLS (the listener is loopback-only by design), no
# http2, no client. Already in the dependency graph transitively via reqwest.
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
futures = "0.3"
bytes = "1"
secrecy = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
wiremock = "0.6"
libc = "0.2"
# Capture-time secret redaction in rb-hooks (W0.5 minimal set; W2.4 expands it).
regex = "1"
fake = "=5.1.0"
rand = "0.10"
assert_cmd = "2"
predicates = "3"
# Builds a binary owned by another workspace crate from within an integration
# test (used by rb-install's e2e to build `rusty-brain-hooks`), resolving the
# true artifact path regardless of profile.
escargot = "0.5"
toml = "0.8"
# Contract-drift guard (rb-contract-guard): parses the wire-shape-defining
# sources with syn to digest type definitions, so comment/formatting-only
# edits never trip the guard.
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing"] }
quote = "1"
# W3.3 token economy: a faithful BPE token counter (o200k_base) used to enforce
# the SessionStart injection budget at runtime and to gate the token-accounting
# CI test. Embeds its vocab (no network at runtime).
tiktoken-rs = "0.6"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.lints.rust]
unsafe_code = "warn"
