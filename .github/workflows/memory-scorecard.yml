# Memory-value scorecard (W3.5 criterion redesign). Drives
# scripts/memory-scorecard.sh: for each scenario it runs five arms (memory-on,
# realistic-baseline, steelman-baseline, length-matched-placebo, memory-off) and
# reports dimension comparisons. The fixed offline exact-ID assertion gate always
# applies; complete live runs also require zero paired causal memory-induced
# errors and zero unassessable pairs. Covers freshness (Class C), retrieval@scale
# (Class A: an equal-importance target among 500+ explicitly planted same-domain
# competitors, with query-only evidence separated from SessionStart context and
# cost reported per ADR-3), capture fidelity
# (Class B: real Claude Code hook-origin SessionEnd summaries), and reach/team
# simulation (Class R: identity A plants, identity B is scored). See
# docs/eval/2026-06-16-w35-criterion-redesign.md, docs/eval/2026-06-19-*, and the
# measured Class C baseline in docs/eval/2026-06-21-w35-class-c-freshness-measured.md.
#
# ALLOWED TO FAIL, WITH ALERTING: scheduled weekly (plus manual dispatch); NEVER
# gates PRs (it is nondeterministic and costs API spend). On failure it opens or
# comments on a pinned issue titled "weekly memory scorecard failing"; on success
# it closes that issue if open. Manual runs leave issues untouched unless opted in.
#
# Uploads a structured TSV whose first 13 fields are stable
# (dimension/scenario/arm/run/success/turns/mie/cost/tok_in/tok_cc/tok_cr/tok_out/
# is_error), followed by capture, injection-size, answer-source, stale-receipt,
# and causal-attribution fields; no model free-text. The always-uploaded assertion
# and metadata JSON sidecars preserve the exact IDs, gate counts, and report hash.
# On FAILURE the workflow additionally uploads per-session evidence retained
# via --log-dir (Vikunja #502): model/session transcripts, daemon
# logs, exact SessionStart/prompt-time injections, raw active/archived recall
# candidates (ids, states, scores, channel flags), and supersede histories.
# These diagnostics are synthetic scorecard data and never key material.
#
# Required repository secret LITELLM_API_KEY and variable LITELLM_BASE_URL.
#   The selected model is litellm/deepseek-v4.1-flash. Session costs are OMP's
#   catalog-priced usage estimates, not authoritative proxy billing.
#   A run is (scenarios x 5 arms x N) sessions, each bounded to 300 seconds.
#   Scheduled runs use N=5; dispatch N=1 for a directional plumbing smoke.
# Credentials currently remain local by user choice: scheduled CI is blocked
# until the user provisions these values. Never fall back to Anthropic credits;
# a local N>=5 result does not close the alert issue or establish CI recovery.
name: memory scorecard

on:
  schedule:
    - cron: "11 10 * * 1" # weekly (Mondays 10:11 UTC), offset from the nightly evals
  workflow_dispatch:
    inputs:
      manage_issue:
        description: "Update the alert issue (scheduled runs always do)"
        type: boolean
        default: false
      runs:
        description: "runs per (scenario, arm); N>=5 for a real read, 1 for a smoke"
        required: false
        default: "5"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  scorecard:
    name: memory scorecard (macOS)
    if: github.repository == 'brianluby/rusty-brain'
    runs-on: macos-latest
    timeout-minutes: 300
    permissions:
      contents: read
      issues: write # open/update/close the alert issue
    steps:
      - name: Preflight - require the LiteLLM credential and endpoint
        env:
          HAVE_KEY: ${{ secrets.LITELLM_API_KEY != '' }}
          LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL }}
        run: |
          if [ "$HAVE_KEY" != "true" ] || [ -z "$LITELLM_BASE_URL" ]; then
            echo "::error::configure repository secret LITELLM_API_KEY and variable LITELLM_BASE_URL."
            exit 1
          fi

      - name: Preflight - verify the key authenticates (status code only)
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL }}
        run: |
          # Validate the secret's shape BEFORE it is used anywhere, then print
          # ONLY the HTTP status; the key and response body are never echoed.
          # 200 = key valid; 401 = invalid/revoked or mangled paste.
          case "$LITELLM_API_KEY" in
            *[[:space:]]*) echo "::error::secret contains whitespace (bad paste?)"; exit 1 ;;
          esac
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 30 \
            -H "Authorization: Bearer ${LITELLM_API_KEY}" \
            "${LITELLM_BASE_URL%/}/models")"
          echo "LiteLLM /models HTTP status: ${status}"
          if [ "$status" != "200" ]; then
            echo "::error::LITELLM_API_KEY did not authenticate (HTTP ${status}); check proxy endpoint and credential."
            exit 1
          fi

      - name: Preflight - bare claude session probe (prints result record, no secrets)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL }}
          CLAUDE_CODE_EXTRA_BODY: '{"cache":{"no-cache":true,"no-store":true},"thinking":{"type":"disabled"}}'
        run: |
          # One minimal -p session outside the scorecard harness: isolates
          # key/billing/model-access errors from harness (hooks/daemon) errors.
          # Only the stream-json system/result records are printed; they carry
          # no key material.
          npm install -g @anthropic-ai/claude-code
          export ANTHROPIC_BASE_URL="${LITELLM_BASE_URL%/}"
          export ANTHROPIC_BASE_URL="${ANTHROPIC_BASE_URL%/v1}"
          probe_home="$(mktemp -d)"
          printf '{"hasCompletedOnboarding": true}\n' > "${probe_home}/.claude.json"
          probe_proj="$(mktemp -d)"
          # macOS runners lack GNU timeout (the scorecard script falls back to
          # gtimeout for the same reason); perl alarm gives a portable 180s
          # bound so a hung CLI cannot eat the 300-minute job budget.
          (
            export HOME="$probe_home"
            cd "$probe_proj"
            perl -e 'alarm 180; exec @ARGV' -- \
              claude -p 'reply with exactly: ok' \
              --model deepseek-v4.1-flash --max-budget-usd 0.50 \
              --output-format stream-json --verbose </dev/null || true
          ) | python3 -c '
          import sys, json
          ok_result = False
          seen = 0
          for line in sys.stdin:
              try:
                  r = json.loads(line)
              except ValueError:
                  continue
              t = r.get("type")
              if t == "system" and r.get("subtype") == "init":
                  seen += 1
                  print("apiKeySource:", r.get("apiKeySource"), "| model:", r.get("model"))
              if t == "assistant":
                  print("response model:", r.get("message", {}).get("model"))
              if t == "result":
                  seen += 1
                  print("result subtype:", r.get("subtype"),
                        "| is_error:", r.get("is_error"),
                        "| turns:", r.get("num_turns"),
                        "| cli_cost_estimate_usd:", r.get("total_cost_usd"))
                  print("result text:", str(r.get("result"))[:300])
                  if not r.get("is_error"):
                      ok_result = True
          if seen == 0:
              print("PROBE FAILURE: no parseable stream-json records at all", file=sys.stderr)
              sys.exit(1)
          if not ok_result:
              print("PROBE FAILURE: no non-error result record (key/billing/model-access problem — the error text is printed above)", file=sys.stderr)
              sys.exit(1)
          '

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Build release binaries
        run: |
          cargo build --release --locked -p rusty-brain -p rb-hooks -p rb-install
          cargo build --release --locked -p rb-eval --bin assertion-precision

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install OMP CLI
        run: |
          bun install --global @oh-my-pi/pi-coding-agent@18.8.6
          echo "${HOME}/.bun/bin" >> "$GITHUB_PATH"
          "${HOME}/.bun/bin/omp" --version

      - name: Self-test (assertion gate + scorecard math, no API)
        run: scripts/memory-scorecard.sh --self-test

      - name: Run the scorecard
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL }}
          PI_SLOW_MODEL: "litellm/deepseek-v4.1-flash"
          # Pass the dispatch input via env (never interpolate ${{ }} into the
          # shell) and validate it's a positive integer before use.
          RUNS_INPUT: ${{ github.event.inputs.runs || '5' }}
        run: |
          case "$RUNS_INPUT" in
            ''|*[!0-9]*|0) echo "::error::'runs' must be a positive integer (got '$RUNS_INPUT')"; exit 1 ;;
          esac
          # --log-dir retains the per-session evidence (stream-json session
          # logs, judged text, daemon logs, exact hook injections, raw ranked
          # candidates/states/channels, and supersede histories) that the
          # harness otherwise deletes with its workroot. The first 2026-07-12
          # N=5 safety-gate MIEs were undiagnosable without this evidence
          # (Vikunja #502). It is uploaded only on failure (below) and carries
          # no key material: the scorecard does not request credential output,
          # the daemon never receives it, and the corpus is synthetic.
          scripts/memory-scorecard.sh \
            --bin-dir target/release \
            --runs "$RUNS_INPUT" \
            --out "${RUNNER_TEMP}/memory-scorecard.tsv" \
            --log-dir "${RUNNER_TEMP}/scorecard-session-logs"

      - name: Upload scorecard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-scorecard-report
          path: |
            ${{ runner.temp }}/memory-scorecard.tsv
            ${{ runner.temp }}/memory-scorecard.tsv.assertions.json
            ${{ runner.temp }}/memory-scorecard.tsv.metadata.json
            ${{ runner.temp }}/memory-scorecard.tsv.scenario-status.tsv
          if-no-files-found: ignore

      - name: Upload per-session diagnostics (failure diagnosis, Vikunja #502)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-scorecard-session-logs
          path: ${{ runner.temp }}/scorecard-session-logs
          if-no-files-found: ignore

      - name: Open or update the alert issue on failure
        if: failure() && (github.event_name == 'schedule' || inputs.manage_issue)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="weekly memory scorecard failing"
          body="Weekly memory-value scorecard failed: ${RUN_URL} (W3.5 scorecard, allowed-to-fail; see .github/workflows/memory-scorecard.yml)."
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,title \
            --jq '[.[] | select(.title == "weekly memory scorecard failing")][0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body")"
            number="${url##*/}"
            gh issue pin "$number" --repo "$GITHUB_REPOSITORY" \
              || echo "could not pin issue #$number; it is open and titled '$title'"
          fi

      - name: Close the alert issue on success
        if: success() && (github.event_name == 'schedule' || inputs.manage_issue)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,title \
            --jq '[.[] | select(.title == "weekly memory scorecard failing")][0].number // empty')"
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "Recovered: ${RUN_URL}"
          fi
