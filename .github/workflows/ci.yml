name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# CI reads the repo by default. The cargo-audit job has the sole write
# exception: rustsec/audit-check creates a GitHub check run on push events.
permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - name: Check formatting
        run: cargo fmt --all --check

  clippy-test:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace

  # macOS mirrors the ubuntu clippy+test job: path resolution is platform-
  # conditional (Library/Caches vs ~/.cache), so the agreement tests must run
  # on both platforms.
  clippy-test-macos:
    name: clippy + test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace

  build-local:
    name: build + clippy (local feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build with local feature
        run: cargo build -p rusty-brain --features local
      - name: Clippy with local feature
        run: cargo clippy -p rusty-brain --features local --all-targets -- -D warnings
      - name: Test rb-embed local (offline only; real-model tests are #[ignore])
        run: cargo test -p rb-embed --features local

  # W5a.4 protocol-evolution policy, operationalized: the wire surface
  # (rb-proto messages + the rb-types payload shapes they embed) and the
  # rb-store migrations are digested and compared against the checked-in
  # contract-snapshot.toml. Any drift fails until the PR records a deliberate
  # decision: `update --intent additive` (serde-default change, no
  # CONTRACT_VERSION bump) or `update --intent breaking` (after bumping it).
  contract-drift:
    name: contract drift guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check contract surface against snapshot
        run: cargo run -p rb-contract-guard -- check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          command: check

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    # rustsec/audit-check reports its result through the Checks API on push.
    # Without this job-scoped grant, a clean audit still fails afterward with
    # "Resource not accessible by integration" while creating the check run.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-agents:
    name: build + clippy + test (agent crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build agent crates
        run: cargo build -p rb-agents -p rb-hooks -p rb-install
      - name: Clippy agent crates
        run: cargo clippy -p rb-agents -p rb-hooks -p rb-install --all-targets -- -D warnings
      - name: Test agent crates
        run: cargo test -p rb-agents -p rb-hooks -p rb-install
      - name: Assert dev/measurement crates stay out of the default rusty-brain closure
        run: |
          set -euo pipefail
          if cargo tree -e no-dev -p rusty-brain | grep -E "rb-agents|rb-hooks|rb-install|rb-eval|rb-contract-guard"; then
            echo "ERROR: a dev/measurement crate leaked into the default rusty-brain (non-dev) dependency closure." >&2
            echo "The rusty-brain binary must NEVER depend on rb-agents/rb-hooks/rb-install/rb-eval/rb-contract-guard." >&2
            exit 1
          fi
          echo "OK: rb-agents/rb-hooks/rb-install/rb-eval/rb-contract-guard are absent from the default rusty-brain closure."
