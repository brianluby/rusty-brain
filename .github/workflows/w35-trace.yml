# W3.5 turn-overhead TRACE (diagnostic; manual dispatch only; NEVER gates PRs).
#
# Drives scripts/w35-trace-tools.sh: for the named scenarios it runs the WORK
# session under memory-on and claude-md with `--output-format stream-json
# --verbose` and tallies per-session tool_use calls, to confirm/refute that the
# memory-on arm spends extra turns on rusty-brain recall/context/get calls that
# the claude-md arm cannot make. Uploads a structured TSV (tool NAMES only, no
# model free-text) — same artifact posture as w35-ab-eval.yml.
#
# Required repository secret:
#   ANTHROPIC_API_KEY — each session runs --model haiku --max-budget-usd 0.50.
name: w35 tool trace

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "work runs per arm per scenario"
        required: false
        default: "2"
      scenarios:
        description: "space-separated scenario ids ([a-z0-9 _-] only)"
        required: false
        default: "time-unix-millis config-settings-toml arch-single-writer"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  trace:
    name: w35 tool trace (macOS)
    if: github.repository == 'brianluby/rusty-brain'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Preflight - require the ANTHROPIC_API_KEY secret
        env:
          HAVE_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAVE_KEY" != "true" ]; then
            echo "::error::repository secret ANTHROPIC_API_KEY is not configured; the trace cannot run."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release binaries
        run: cargo build --release --locked -p rusty-brain -p rb-hooks -p rb-install

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Self-test (token math + cache aggregate, no API)
        run: scripts/w35-trace-tools.sh --self-test

      - name: Run the tool trace
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RB_W35_MAX_BUDGET_USD: "0.50"
          # Pass dispatch inputs via env (never interpolate ${{ }} into the shell)
          # and validate before use, so a crafted value cannot inject shell.
          RUNS_INPUT: ${{ github.event.inputs.runs || '2' }}
          SCENARIOS_INPUT: ${{ github.event.inputs.scenarios || 'time-unix-millis config-settings-toml arch-single-writer' }}
        run: |
          case "$RUNS_INPUT" in
            ''|*[!0-9]*|0) echo "::error::'runs' must be a positive integer (got '$RUNS_INPUT')"; exit 1 ;;
          esac
          case "$SCENARIOS_INPUT" in
            *[!a-z0-9\ _-]*) echo "::error::'scenarios' may contain only [a-z0-9 _-]"; exit 1 ;;
          esac
          scripts/w35-trace-tools.sh \
            --bin-dir target/release \
            --runs "$RUNS_INPUT" \
            --scenarios "$SCENARIOS_INPUT" \
            --out "${RUNNER_TEMP}/w35-trace.tsv"

      - name: Upload the trace TSV
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: w35-trace-report
          path: ${{ runner.temp }}/w35-trace.tsv
          if-no-files-found: ignore
