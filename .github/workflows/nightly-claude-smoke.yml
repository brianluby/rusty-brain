# Gate tier (b): nightly real-Claude-Code smoke (plan §3 carryover, C4).
#
# Drives scripts/nightly-claude-smoke.sh on macOS: a REAL headless `claude -p`
# session against freshly built binaries with hooks + MCP installed into an
# isolated HOME, proving capture -> idle -> recall reaches ONE daemon and ONE
# 0600 DB, and that a planted fake AWS key yields zero plaintext grep hits in
# the DB bytes. The first green run on a macOS runner is the recorded evidence
# that closes spike S1 (claude -p fires lifecycle hooks headlessly).
#
# ALLOWED TO FAIL, WITH ALERTING: this workflow is scheduled-only (plus manual
# dispatch) and NEVER gates PRs. On failure it opens — or comments on — a
# pinned issue titled "nightly claude smoke failing"; on success it closes
# that issue if it is open. Manual runs leave issues untouched unless opted in.
#
# Required repository secret LITELLM_API_KEY and variable LITELLM_BASE_URL.
# Claude Code uses the proxy's native Anthropic Messages endpoint with model
# deepseek-v4.1-flash. Its $1 CLI budget is not authoritative proxy billing.
# Missing provider configuration fails before any model session.
# Credentials currently remain local by user choice: scheduled CI is blocked
# until the user provisions these values. Never fall back to Anthropic credits;
# local proof does not close the GitHub alert issue or establish CI recovery.
name: nightly claude smoke

on:
  schedule:
    - cron: "23 8 * * *" # nightly, off the top of the hour
  workflow_dispatch:
    inputs:
      manage_issue:
        description: "Update the alert issue (scheduled runs always do)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  smoke:
    name: real claude -p smoke (macOS)
    # Scheduled runs on forks would burn someone else's API budget; the smoke
    # is only meaningful on the canonical repo.
    if: github.repository == 'brianluby/rusty-brain'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write # open/update/close the alert issue
    steps:
      - name: Preflight - require the LiteLLM credential and endpoint
        env:
          HAVE_KEY: ${{ secrets.LITELLM_API_KEY != '' }}
          LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL }}
        run: |
          if [ "$HAVE_KEY" != "true" ] || [ -z "$LITELLM_BASE_URL" ]; then
            echo "::error::configure repository secret LITELLM_API_KEY and variable LITELLM_BASE_URL."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2

      - name: Build release binaries
        run: cargo build --release --locked -p rusty-brain -p rb-hooks -p rb-install

      # DELIBERATELY UNPINNED (recorded trade-off): tracking whatever version
      # npm serves is the point of a smoke against the real CLI — a pinned
      # version would stop catching the breakage class this job exists for
      # (Claude Code changing hook/headless behavior under us). The exposure
      # (a compromised release runs with the spend-capped key in env) is
      # bounded by the $1 budget and the log scrub below; revisit if the
      # supply-chain calculus changes.
      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run the smoke (capture -> idle -> recall + planted-secret DB grep)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL }}
          SMOKE_WORKDIR: ${{ runner.temp }}/claude-smoke
        run: |
          export ANTHROPIC_BASE_URL="${LITELLM_BASE_URL%/}"
          export ANTHROPIC_BASE_URL="${ANTHROPIC_BASE_URL%/v1}"
          scripts/nightly-claude-smoke.sh --bin-dir target/release --model deepseek-v4.1-flash

      # GitHub's automatic secret masking covers step logs ONLY — not artifact
      # file contents. The smoke runs a real model session with unrestricted
      # Bash and the API key in env, and captures everything it prints; if the
      # session (or a compromised CLI release) ever echoes the key, it must
      # not land in a downloadable artifact. Scrub fail-closed before upload.
      - name: Scrub any leaked API key from logs before upload
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/claude-smoke"
          [ -d "$dir" ] || exit 0
          for f in "$dir"/*.log; do
            [ -e "$f" ] || continue
            if grep -Fq "$ANTHROPIC_API_KEY" "$f"; then
              # perl with \Q..\E: literal replacement, no sed-metacharacter
              # escaping pitfalls; -i is portable across GNU/BSD perl.
              KEY="$ANTHROPIC_API_KEY" perl -pi -e 's/\Q$ENV{KEY}\E/[CI-REDACTED]/g' "$f"
              echo "::warning::ANTHROPIC_API_KEY found in $(basename "$f"); redacted before artifact upload"
            fi
          done

      # The uploaded logs (claude transcript output + recall output) are the
      # recorded-run evidence S1 asks for: hook events demonstrably arrived.
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-claude-smoke-logs
          path: ${{ runner.temp }}/claude-smoke/*.log
          if-no-files-found: ignore

      - name: Open or update the alert issue on failure
        if: failure() && (github.event_name == 'schedule' || inputs.manage_issue)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="nightly claude smoke failing"
          body="Nightly real-Claude-Code smoke failed: ${RUN_URL} (gate tier (b), allowed-to-fail; see .github/workflows/nightly-claude-smoke.yml)."
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,title \
            --jq '[.[] | select(.title == "nightly claude smoke failing")][0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            url="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body")"
            number="${url##*/}"
            # Pinning needs more than issues:write on some token configs; an
            # unpinned open issue still alerts, so do not fail the step over it.
            gh issue pin "$number" --repo "$GITHUB_REPOSITORY" \
              || echo "could not pin issue #$number; it is open and titled '$title'"
          fi

      - name: Close the alert issue on success
        if: success() && (github.event_name == 'schedule' || inputs.manage_issue)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,title \
            --jq '[.[] | select(.title == "nightly claude smoke failing")][0].number // empty')"
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "Recovered: ${RUN_URL}"
          fi
