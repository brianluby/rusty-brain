[package]
name = "rb-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rusty-brain single-writer daemon: dedicated writer thread, read pool, UDS listener, change broadcast, server-side isolation."

[lib]
name = "rb_daemon"
path = "src/lib.rs"

[dependencies]
rb-types = { path = "../rb-types" }
rb-config = { path = "../rb-config" }
rb-store = { path = "../rb-store" }
rb-engine = { path = "../rb-engine" }
rb-embed = { path = "../rb-embed" }
rb-enrich = { path = "../rb-enrich" }
rb-proto = { path = "../rb-proto" }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
# HTTP body encoding (HTTP PRD) + review_resolve / review_sweep oplog detail
# payloads (PRD 2026-07-02 review).
serde_json = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
toml = { workspace = true }
# Opt-in loopback HTTP listener (HTTP PRD): http1 + server only, no TLS.
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
# Raw connection for test-local failure injection (SQLite RAISE triggers).
rusqlite = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
