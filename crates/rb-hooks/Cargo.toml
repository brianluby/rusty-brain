[package]
name = "rb-hooks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rusty-brain: per-event capture hook binary (fail-open) for JSON-protocol agent CLIs."

[[bin]]
name = "rusty-brain-hooks"
path = "src/main.rs"

[dependencies]
rb-agents = { path = "../rb-agents" }
rb-types = { path = "../rb-types" }
rb-config = { path = "../rb-config" }
rb-proto = { path = "../rb-proto" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Minimal capture-time secret redaction (W0.5).
rb-redact = { path = "../rb-redact" }
# W3.3: enforce the <=600-token SessionStart injection budget at capture time
# (fail-safe — count_tokens never panics, preserving the fail-open contract).
rb-tokens = { path = "../rb-tokens" }

[dev-dependencies]
# Dev-only: the path-agreement tests pin hooks-resolution == daemon-resolution.
rb-daemon = { path = "../rb-daemon" }
tokio = { workspace = true }
tokio-util = { workspace = true }
tempfile = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }

[lints]
workspace = true
