[package]
name = "rb-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Offline, deterministic retrieval-quality regression harness for rusty-brain (dev/CI only)."
publish = false

# This is a dev/measurement crate. It is deliberately NOT a dependency of the
# `rusty-brain` binary; nothing in the shipped closure depends on it. The CI
# agent/closure gate asserts it never appears in `cargo tree -e no-dev -p rusty-brain`.

[lints]
workspace = true

[features]
# Pulls in rb-embed's local ONNX provider so the manual `#[ignore]` recording
# test can capture real vectors. OFF by default: CI and the replay path never
# compile fastembed/ort.
record-local = ["rb-embed/local"]

[dependencies]
rb-engine = { path = "../rb-engine" }
rb-store = { path = "../rb-store" }
rb-search = { path = "../rb-search" }
rb-embed = { path = "../rb-embed" }
rb-types = { path = "../rb-types" }
rb-daemon = { path = "../rb-daemon" }
rb-proto = { path = "../rb-proto" }
rb-mcp = { path = "../rb-mcp" }
rb-redact = { path = "../rb-redact" }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
rusqlite = { workspace = true }
libc = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
# Record/replay fixture keys are (model_id, input_kind, sha256(text)).
sha2 = { workspace = true }
regex = { workspace = true }
# Faker is augmentation-only. Keep the exact version pinned at workspace level;
# generated aliases, variants, and distractor corpora also record the seed.
fake = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
# The scale harness is an example target so its high-throughput fixture loader
# cannot enable `bench-utils` in normal workspace or release builds.
rb-store = { path = "../rb-store", features = ["bench-utils"] }
