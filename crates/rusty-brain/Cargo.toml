[package]
name = "rusty-brain"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rusty-brain: shared agent memory daemon and CLI."

[[bin]]
name = "rusty-brain"
path = "src/main.rs"

[lib]
name = "rusty_brain"
path = "src/lib.rs"

[features]
# Forward the local ONNX embedding backend to rb-embed. OFF by default;
# enabled in CI by the `build-local` job and at runtime via `--features local`.
local = ["rb-embed/local"]

[dependencies]
rb-types = { path = "../rb-types" }
rb-config = { path = "../rb-config" }
rb-proto = { path = "../rb-proto" }
rb-daemon = { path = "../rb-daemon" }
rb-embed = { path = "../rb-embed" }
rb-mcp = { path = "../rb-mcp" }
async-trait = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
