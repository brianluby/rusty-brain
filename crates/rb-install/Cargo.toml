[package]
name = "rb-install"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rusty-brain-install: merge/uninstall/status engine that wires JSON-protocol CLIs to rusty-brain-hooks."

[[bin]]
name = "rusty-brain-install"
path = "src/main.rs"

[lib]
name = "rb_install"
path = "src/lib.rs"

[dependencies]
rb-agents = { path = "../rb-agents" }
rb-types = { path = "../rb-types" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rb-types = { path = "../rb-types" }
rb-proto = { path = "../rb-proto" }
rb-daemon = { path = "../rb-daemon" }
rb-embed = { path = "../rb-embed" }
# W3.6a drift guard: the permissions.allow list must equal the MCP server's
# default advertised toolset (rb_mcp::tools::DEFAULT_TOOLS), so no advertised
# tool stalls a headless run.
rb-mcp = { path = "../rb-mcp" }
tokio = { workspace = true }
serde_json = { workspace = true }
assert_cmd = { workspace = true }
escargot = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
